<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCHOOL MONEY - Smart AI Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --bbl-blue: #0033A0; --bbl-orange: #F37021; --bg-color: #F4F5F7; }
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-color); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 450px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow-y: auto; position: relative; }
        .screen { display: none; padding: 25px 20px; flex-direction: column; min-height: 100vh; }
        .active { display: flex; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .bbl-header { text-align: center; margin-bottom: 20px; }
        .bbl-logo { font-size: 3rem; color: var(--bbl-blue); margin-bottom: 5px; }
        .bbl-header h2 { color: var(--bbl-blue); font-weight: 700; }
        .bbl-line { height: 4px; width: 50px; background: var(--bbl-orange); margin: 10px auto; border-radius: 2px; }

        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        input.center { text-align: center; letter-spacing: 1px; }
        input:focus, select:focus { border-color: var(--bbl-blue); outline: none; }
        
        .btn-primary { width: 100%; padding: 14px; background: var(--bbl-blue); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .text-link { text-align: center; color: var(--bbl-blue); font-size: 0.9rem; cursor: pointer; text-decoration: underline; margin-top: 5px; }

        .scan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-scan-income { background: #E8F5E9; color: #2E7D32; border: 2px dashed #2E7D32; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-scan-expense { background: #FFEBEE; color: #D32F2F; border: 2px dashed #D32F2F; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
        .scan-msg { font-size: 0.85rem; color: var(--bbl-blue); text-align: center; font-weight: bold; margin-bottom: 5px; min-height: 20px; }
        
        .bank-filter { display: flex; gap: 8px; margin-bottom: 15px; align-items: center; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .bank-filter select { margin-bottom: 0; padding: 8px; font-size: 0.9rem; flex: 1; border: 1px solid var(--bbl-blue); color: var(--bbl-blue); font-weight: bold; border-radius: 4px;}
        .bank-filter button { padding: 8px 12px; background: var(--bbl-orange); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .table-responsive { overflow-x: auto; margin-top: 10px; border: 1px solid #ddd; border-radius: 4px; }
        table { width: 650px; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; font-size: 0.85rem; }
        th { background: #f0f0f0; }
        .col-amt { text-align: right; font-family: monospace; font-size: 0.95rem; }
        .text-income { color: #2E7D32; font-weight: bold; }
        .text-expense { color: #D32F2F; font-weight: bold; }
        .text-balance { color: var(--bbl-blue); font-weight: bold; }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- หน้าเข้าสู่ระบบ -->
        <div id="login-scr" class="screen active">
            <div class="bbl-header"><div class="bbl-logo">🏦</div><h2>SCHOOL MONEY</h2><div class="bbl-line"></div></div>
            <input type="text" id="login-name" class="center" placeholder="ชื่อผู้ใช้งาน">
            <input type="password" id="login-pin" class="center" placeholder="รหัส PIN 6 หลัก" maxlength="6">
            <button class="btn-primary" onclick="doLogin()">เข้าสู่ระบบ</button>
            <div class="text-link" onclick="switchScreen('register-scr')">สมัครสมาชิกใหม่</div>
        </div>

        <!-- หน้าสมัครสมาชิก -->
        <div id="register-scr" class="screen">
            <div class="bbl-header"><div class="bbl-logo">📝</div><h2>สมัครสมาชิกใหม่</h2><div class="bbl-line"></div></div>
            <input type="text" id="reg-name" class="center" placeholder="ตั้งชื่อผู้ใช้งาน">
            <input type="password" id="reg-pin" class="center" placeholder="ตั้งรหัส PIN 6 หลัก" maxlength="6">
            <input type="password" id="reg-pin-confirm" class="center" placeholder="ยืนยันรหัส PIN 6 หลัก" maxlength="6">
            <button class="btn-primary" style="background: var(--bbl-orange);" onclick="doRegister()">ยืนยันการสมัคร</button>
            <div class="text-link" onclick="switchScreen('login-scr')">กลับไปหน้าเข้าสู่ระบบ</div>
        </div>

        <!-- หน้า Dashboard หลัก -->
        <div id="main-scr" class="screen">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
                <strong style="color:var(--bbl-blue);">👤 <span id="user-show">User</span></strong>
                <div>
                    <button onclick="switchScreen('pin-scr')" style="background:var(--bbl-orange); color:white; border:none; padding:6px 10px; border-radius:4px; font-size:0.75rem; cursor:pointer;">เปลี่ยน PIN</button>
                    <button onclick="location.reload()" style="background:#eee; border:none; padding:6px 10px; border-radius:4px; font-size:0.75rem; cursor:pointer;">ออกระบบ</button>
                </div>
            </div>
            
            <div style="background: #ffffff; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <p style="font-weight:bold; color:var(--bbl-blue); margin-bottom:10px; text-align:center;">✨ AI สแกนสลิปอัจฉริยะ (ได้สูงสุด 8 ใบ/ครั้ง)</p>
                <div class="scan-grid">
                    <label class="btn-scan-income">
                        🟢 อัปโหลด<br/>สลิป "รายรับ"
                        <!-- เพิ่ม multiple ให้เลือกไฟล์ได้หลายไฟล์พร้อมกัน -->
                        <input type="file" accept="image/*" multiple hidden onchange="processWithAI(event, 'income')">
                    </label>
                    <label class="btn-scan-expense">
                        🔴 อัปโหลด<br/>สลิป "รายจ่าย"
                        <!-- เพิ่ม multiple ให้เลือกไฟล์ได้หลายไฟล์พร้อมกัน -->
                        <input type="file" accept="image/*" multiple hidden onchange="processWithAI(event, 'expense')">
                    </label>
                </div>
                <div id="status-msg" class="scan-msg"></div>
            </div>
            
            <div class="bank-filter">
                <select id="filter-month">
                    <option value="all">รวมทุกเดือน</option>
                    <option value="01">มกราคม</option>
                    <option value="02">กุมภาพันธ์</option>
                    <option value="03">มีนาคม</option>
                    <option value="04">เมษายน</option>
                    <option value="05">พฤษภาคม</option>
                    <option value="06">มิถุนายน</option>
                    <option value="07">กรกฎาคม</option>
                    <option value="08">สิงหาคม</option>
                    <option value="09">กันยายน</option>
                    <option value="10">ตุลาคม</option>
                    <option value="11">พฤศจิกายน</option>
                    <option value="12">ธันวาคม</option>
                </select>
                <select id="filter-year"></select>
                <button onclick="loadData()">🔍 ค้นหา</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2" style="width:15%">วัน เดือน ปี</th>
                            <th rowspan="2" style="width:25%">รายการ</th>
                            <th colspan="2">ยอดเงิน (บาท)</th>
                            <th rowspan="2" style="width:18%">คงเหลือ (บาท)</th>
                            <th rowspan="2" style="width:15%">หมายเหตุ</th>
                        </tr>
                        <tr>
                            <th style="background:#E8F5E9; width:13.5%">รายรับ</th>
                            <th style="background:#FFEBEE; width:13.5%">รายจ่าย</th>
                        </tr>
                    </thead>
                    <tbody id="history-table"></tbody>
                </table>
            </div>
        </div>

        <!-- หน้าเปลี่ยน PIN -->
        <div id="pin-scr" class="screen">
            <div class="bbl-header"><h2>เปลี่ยนรหัส PIN</h2><div class="bbl-line"></div></div>
            <input type="password" id="old-pin" class="center" placeholder="รหัส PIN เก่า 6 หลัก" maxlength="6">
            <input type="password" id="new-pin" class="center" placeholder="รหัส PIN ใหม่ 6 หลัก" maxlength="6">
            <input type="password" id="new-pin-confirm" class="center" placeholder="ยืนยันรหัส PIN ใหม่" maxlength="6">
            <button class="btn-primary" onclick="changePin()">บันทึกรหัสผ่านใหม่</button>
            <button onclick="switchScreen('main-scr')" style="width:100%; padding:14px; border:none; background:#eee; border-radius:6px; font-weight:bold; cursor:pointer;">ยกเลิก</button>
        </div>

    </div>

    <script>
        const SB_URL = 'https://nnxraimetlwvsekburkm.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueHJhaW1ldGx3dnNla2J1cmttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODEyMjgsImV4cCI6MjEwMDU1NzIyOH0.6fGLFjKsKO94EVf3B_es1P-ImXnkcreC3zRKxiaDEiM';
        const sb = supabase.createClient(SB_URL, SB_KEY);
        
        let currentUser = "";

        function setupDateFilters() {
            const ySelect = document.getElementById('filter-year');
            const d = new Date();
            const curYear = d.getFullYear();
            let yHtml = '<option value="all">รวมทุกปี</option>';
            for(let i = curYear + 2; i >= curYear - 20; i--) yHtml += `<option value="${i}">${i + 543}</option>`;
            ySelect.innerHTML = yHtml;
            ySelect.value = curYear.toString();
            document.getElementById('filter-month').value = (d.getMonth() + 1).toString().padStart(2, '0');
        }
        setupDateFilters();

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function doRegister() {
            const u = document.getElementById('reg-name').value;
            const p = document.getElementById('reg-pin').value;
            const cp = document.getElementById('reg-pin-confirm').value;

            if(!u || !p || !cp) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");
            if(p !== cp) return alert("รหัส PIN ไม่ตรงกัน");
            if(p.length !== 6) return alert("รหัส PIN ต้องมี 6 หลัก");

            document.querySelector('#register-scr .btn-primary').innerText = "กำลังดำเนินการ...";
            const { data: existingUser } = await sb.from('users').select('username').eq('username', u);
            if(existingUser && existingUser.length > 0) {
                document.querySelector('#register-scr .btn-primary').innerText = "ยืนยันการสมัคร";
                return alert("ชื่อผู้ใช้งานนี้มีคนใช้แล้ว");
            }

            const { error } = await sb.from('users').insert([{ username: u, pin: p }]);
            if(error) alert("Error: " + error.message);
            else {
                alert("🎉 สมัครสมาชิกสำเร็จ!");
                document.getElementById('login-name').value = u;
                switchScreen('login-scr');
            }
            document.querySelector('#register-scr .btn-primary').innerText = "ยืนยันการสมัคร";
        }

        async function doLogin() {
            const u = document.getElementById('login-name').value;
            const p = document.getElementById('login-pin').value;
            const { data } = await sb.from('users').select('*').eq('username', u).eq('pin', p);
            if(data?.length > 0) {
                currentUser = u; document.getElementById('user-show').innerText = u;
                switchScreen('main-scr'); loadData();
            } else alert("ชื่อผู้ใช้งาน หรือ PIN ไม่ถูกต้อง");
        }

        async function changePin() {
            const oldP = document.getElementById('old-pin').value;
            const newP = document.getElementById('new-pin').value;
            const confP = document.getElementById('new-pin-confirm').value;

            if(newP !== confP) return alert("รหัส PIN ใหม่ไม่ตรงกัน");
            if(newP.length !== 6) return alert("PIN ต้องมี 6 หลัก");

            const { data } = await sb.from('users').select('*').eq('username', currentUser).eq('pin', oldP);
            if(data?.length > 0) {
                await sb.from('users').update({ pin: newP }).eq('username', currentUser);
                alert("เปลี่ยนรหัส PIN สำเร็จ!");
                document.getElementById('old-pin').value = ''; document.getElementById('new-pin').value = ''; document.getElementById('new-pin-confirm').value = '';
                switchScreen('main-scr');
            } else alert("รหัส PIN เก่าไม่ถูกต้อง");
        }

        async function fileToGenerativePart(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve({
                    inlineData: { data: reader.result.split(',')[1], mimeType: file.type }
                });
                reader.readAsDataURL(file);
            });
        }

        async function processWithAI(e, txType) {
            const files = e.target.files;
            if(!files || files.length === 0) return;

            // ตรวจสอบว่าอัปโหลดเกิน 8 ใบหรือไม่
            if (files.length > 8) {
                alert("⚠️ คุณเลือกสลิปเกินจำนวนที่กำหนด! สามารถอัปโหลดได้สูงสุด 8 สลิปต่อครั้งครับ");
                e.target.value = '';
                return;
            }

            const statusTxt = document.getElementById('status-msg');
            const typeName = txType === 'income' ? 'รายรับ' : 'รายจ่าย';
            
            let successCount = 0;
            let failCount = 0;

            try {
                // ดึง API Key จากระบบหลังบ้านเพียงครั้งเดียวเพื่อประมวลผลทุกสลิป
                statusTxt.innerText = `✨ กำลังดึงคีย์ระบบ...`;
                statusTxt.style.color = "var(--bbl-blue)";

                const { data: settingData, error: setErr } = await sb
                    .from('settings')
                    .select('key_value')
                    .eq('key_name', 'gemini_api_key')
                    .single();

                if (setErr || !settingData || !settingData.key_value) {
                    throw new Error("ระบบหลังบ้านยังไม่ได้ตั้งค่า API Key (กรุณาให้ Admin ตั้งค่าในหน้าหลังบ้านก่อน)");
                }

                const apiKey = settingData.key_value;

                // วนลูปประมวลผลทีละสลิป
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    statusTxt.innerText = `⏳ กำลังประมวลผลสลิปที่ ${i + 1} จากทั้งหมด ${files.length} ใบ...`;
                    statusTxt.style.color = "var(--bbl-blue)";

                    try {
                        const imagePart = await fileToGenerativePart(file);
                        
                        const prompt = `Analyze this Thai bank slip with 100% accuracy. 
                                        Extract:
                                        1. exact transfer amount (number only, no comma)
                                        2. date in YYYY-MM-DD format (convert Thai Buddhist year e.g. 2569 to Gregorian 2026)
                                        3. time in HH:MM format
                                        Return ONLY a valid JSON object strictly matching this format without any markdown tags:
                                        {"amount": 0.00, "date": "YYYY-MM-DD", "time": "HH:MM"}`;

                        const requestBody = {
                            contents: [{ parts: [{ text: prompt }, imagePart] }]
                        };

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(requestBody)
                        });

                        const data = await response.json();
                        
                        if(!response.ok) {
                            console.error(`AI Error for slip ${i + 1}:`, data.error?.message);
                            failCount++;
                            continue; // ข้ามไปทำสลิปใบถัดไป
                        }

                        let rawText = data.candidates[0].content.parts[0].text;
                        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                        
                        const result = JSON.parse(rawText);

                        if (!result.amount || result.amount <= 0 || !result.date) {
                            failCount++;
                            continue;
                        }

                        const slipNote = `${typeName} เวลา ${result.time || '00:00'} น.`;

                        // ตรวจสอบสลิปซ้ำ
                        const { data: duplicateCheck } = await sb
                            .from('transactions')
                            .select('*')
                            .eq('username', currentUser)
                            .eq('amount', result.amount)
                            .eq('date', result.date)
                            .ilike('slip_text', `%เวลา ${result.time}%`);

                        if (duplicateCheck && duplicateCheck.length > 0) {
                            failCount++;
                            continue; // สลิปซ้ำ ข้ามไปใบถัดไป
                        }
                        
                        // บันทึกลงฐานข้อมูล
                        const { error: dbError } = await sb.from('transactions').insert([{ 
                            username: currentUser, 
                            amount: result.amount, 
                            type: txType, 
                            date: result.date, 
                            slip_text: slipNote
                        }]);

                        if (dbError) {
                            console.error(`DB Error for slip ${i + 1}:`, dbError.message);
                            failCount++;
                        } else {
                            successCount++;
                        }

                    } catch (fileErr) {
                        console.error(`Error processing slip ${i + 1}:`, fileErr);
                        failCount++;
                    }
                } // สิ้นสุดลูปประมวลผล

                // อัปเดตสถานะสุดท้าย
                statusTxt.innerText = `✅ สำเร็จ ${successCount} ใบ | ❌ ไม่ผ่าน/ซ้ำ ${failCount} ใบ`;
                statusTxt.style.color = failCount > 0 ? (successCount > 0 ? "#F39C12" : "#D32F2F") : "#2E7D32";
                
                setTimeout(() => statusTxt.innerText = "", 5000);
                loadData(); 

            } catch (err) {
                statusTxt.innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
                statusTxt.style.color = "red";
                console.error(err);
            }
            e.target.value = ''; // รีเซ็ต input สำหรับอัปโหลดรอบต่อไป
        }

        async function loadData() {
            const { data } = await sb.from('transactions').select('*').eq('username', currentUser).order('date', {ascending: true}).order('id', {ascending: true});
            
            const selMonth = document.getElementById('filter-month').value;
            const selYear = document.getElementById('filter-year').value;

            let runningBalance = 0;
            let filteredData = [];

            if(data) {
                data.forEach(item => {
                    const amt = parseFloat(item.amount);
                    item.type === 'income' ? runningBalance += amt : runningBalance -= amt;
                    item.balance = runningBalance;

                    const [y, m, d] = item.date.split('-');
                    let matchMonth = (selMonth === 'all') || (m === selMonth);
                    let matchYear = (selYear === 'all') || (y === selYear);

                    if(matchMonth && matchYear) {
                        filteredData.push(item);
                    }
                });
            }

            filteredData.reverse();

            if(filteredData.length === 0) {
                document.getElementById('history-table').innerHTML = `<tr><td colspan="5" style="padding:20px; color:#888;">ไม่มีรายการในเดือน/ปี ที่เลือก</td></tr>`;
                return;
            }

            document.getElementById('history-table').innerHTML = filteredData.map(i => {
                const isInc = i.type === 'income';
                const dParts = i.date.split('-');
                const thDate = `${parseInt(dParts[2])}/${parseInt(dParts[1])}/${(parseInt(dParts[0])+543).toString().substring(2)}`;
                const aStr = parseFloat(i.amount).toLocaleString('th-TH', {minimumFractionDigits:2});
                const bStr = parseFloat(i.balance).toLocaleString('th-TH', {minimumFractionDigits:2});
                
                const inCol = isInc ? `<td class="col-amt text-income">${aStr}</td>` : `<td class="col-amt">-</td>`;
                const outCol = !isInc ? `<td class="col-amt text-expense">${aStr}</td>` : `<td class="col-amt">-</td>`;

                return `<tr>
                    <td>${thDate}</td>
                    <td style="text-align:left;">ทำรายการ</td>
                    ${inCol}${outCol}
                    <td class="col-amt text-balance">${bStr}</td>
                    <td style="text-align:left;">${i.slip_text || '-'}</td>
                </tr>`;
            }).join('');
        }
    </script>
</body>
</html>
